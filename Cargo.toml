[package]
edition = "2024"
name = "lurkr"
version = "0.7.0"

[[bin]]
name = "lurkr"
path = "./src/bin/main.rs"

[dependencies]
anyhow = "1.0.105"
futures = "0.3.34"
http-body-util = { version = "0.1.5", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
indexmap = "2.14.2"
log = "0.4.35"
rand = { version = "0.10.4", features = ['thread_rng'] }
rcgen = "0.14.10"
regex = "1.13.2"
rustls = "0.23.46"
rustls-pki-types = "1.16.0"
rustls-webpki = "0.103.17"
serde = "1.0.229"
serde_derive = "1.0.229"
structopt = "0.3.26"
tokio-rustls = "0.26.6"
tracing = "0.1.44"
tracing-attributes = "0.1.31"
tracing-subscriber = "0.3.23"

[dependencies.tokio]
features = ["full"]
version = "1.54.1"

[dependencies.hyper]
features = ["full"]
version = "1.13.0"

[dependencies.config]
features = ["preserve_order"]
version = "0.15.27"
